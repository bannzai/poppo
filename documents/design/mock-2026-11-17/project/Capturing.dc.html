<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Poppo 取り込み中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#2450D8}a:hover{color:#1A3BA6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 24px; background: #FFFFFF; color: #14171C; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700">Poppo</h1>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 14px; background: #F3F5F8">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7" fill="#B3261E"></circle></svg>
      <p style="margin: 0; font-size: 20px; line-height: 1.3; font-weight: 700">取り込み中</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5B6472">画面の文字を端末の中で読んでいます</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5B6472">画面の内容を端末の外へ送りません</p>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid #DFE3EA; font-size: 14px; line-height: 1.5">
      <span style="color: #5B6472">最後に読んだ時刻</span>
      <span style="font-weight: 500">14:32</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 700">次にすること</h2>
    <ol style="margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.6">
      <li>チャットアプリを開く</li>
      <li>入力欄をタップしてキーボードを Poppo に切り替える</li>
      <li>出てきた返信案をタップする</li>
    </ol>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1.5px solid #B3261E; border-radius: 12px; background: #FFFFFF; color: #B3261E; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg>
      取り込みを止める
    </button>
    <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5B6472; text-align: center">止めると読み取った内容は端末から消えます</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/** 取り込み中の画面。文言はすべて markup に直接書いてあり、渡す値は無い */
class Component extends DCLogic {
/** 渡す値が無いため、空の値を返す */
renderVals() {
return {};
}
}
</script>
</body>
</html>
