<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Poppo ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#2450D8}a:hover{color:#1A3BA6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 24px; background: #FFFFFF; color: #14171C; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700">Poppo</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5B6472">スクリーンショットを選ぶと翻訳と返信案が出ます</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 700">直近のスクリーンショット</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{shots}}" as="shot" hint-placeholder-count="6">
        <button aria-label="{{shot.label}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; color: inherit">
          <span style="display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; box-sizing: border-box; width: 100%; height: 172px; padding: 10px; border-radius: 10px; background: #F3F5F8; border: 1px solid #DFE3EA">
            <span style="display: block; height: 8px; width: 70%; border-radius: 3px; background: #C9D0DB"></span>
            <span style="display: block; height: 8px; width: 90%; border-radius: 3px; background: #C9D0DB"></span>
            <span style="display: block; height: 8px; width: 55%; border-radius: 3px; background: #C9D0DB"></span>
          </span>
          <span style="font-size: 12px; line-height: 1.4; color: #5B6472">{{shot.when}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; background: #F3F5F8">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 700">アプリを切り替えずに読む</h2>
      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5B6472">取り込み中はチャットを開いたままキーボードに翻訳と返信案が出ます</p>
    </div>
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M10 18h4"></path></svg>
      取り込みを始める
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2450D8"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const whens = ['2 分前', '18 分前', '1 時間前', '3 時間前', '昨日', '昨日'];
return {
accent: this.props.accent ?? '#2450D8',
shots: whens.map((when) => ({ when: when, label: when + 'に撮ったスクリーンショットを読む' })),
};
}
}
</script>
</body>
</html>
