<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>thread-light-japanese</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: #fff; color: #1d1c1d; }
  .nav { border-bottom: 1px solid #e3e3e3; }
  .messages { padding: 10px 0; }
  .message { display: flex; padding: 8px 16px; }
  .avatar { width: 36px; height: 36px; border-radius: 6px; margin-right: 10px; flex: none; }
  .head { font-weight: 800; font-size: 15px; }
  .head span { font-weight: 400; font-size: 12px; color: #616061; margin-left: 6px; }
  .input { border-top: 1px solid #e3e3e3; }
  .input .field { border: 1px solid #bbb; color: #868686; border-radius: 8px; }
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span>5G</span></div>
  <div class="nav"><span class="back">‹</span># 開発</div>
  <div class="messages">
    <div class="message">
      <div class="avatar" style="background:#7c3aed"></div>
      <div>
        <div class="head">水瀬 あおい <span>14:05</span></div>
        <div>ログイン画面の修正をマージしました。<br>確認をお願いします。</div>
      </div>
    </div>
    <div class="message">
      <div class="avatar" style="background:#0ea5e9"></div>
      <div>
        <div class="head">槙原 そうた <span>14:12</span></div>
        <div>ありがとうございます。今から見ます。</div>
      </div>
    </div>
    <div class="message">
      <div class="avatar" style="background:#0ea5e9"></div>
      <div>
        <div class="head">槙原 そうた <span>14:30</span></div>
        <div>パスワードを間違えた時の文言だけ<br>少し分かりにくいと思いました。</div>
      </div>
    </div>
    <div class="message">
      <div class="avatar" style="background:#7c3aed"></div>
      <div>
        <div class="head">水瀬 あおい <span>14:33</span></div>
        <div>明日の朝までに直しておきます。</div>
      </div>
    </div>
  </div>
  <div class="input"><div class="field">#開発 へのメッセージ</div></div>
</body>
</html>
