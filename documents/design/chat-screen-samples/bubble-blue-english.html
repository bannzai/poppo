<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bubble-blue-english</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: #fff; color: #000; }
  .nav { border-bottom: 1px solid #e5e5ea; background: #f9f9f9; }
  .status { background: #f9f9f9; }
  .messages { padding: 14px 14px; gap: 14px; }
  .bubble { max-width: 290px; padding: 8px 14px; border-radius: 19px; font-size: 17px; line-height: 22px; }
  .other { align-self: flex-start; background: #e9e9eb; }
  .user { align-self: flex-end; background: #0b84fe; color: #fff; }
  .input .field { border: 1px solid #c7c7cc; color: #a0a0a5; }
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span>5G</span></div>
  <div class="nav"><span class="back">‹</span>Harbor Books</div>
  <div class="messages">
    <div class="bubble other">Hi! Your order is ready for pickup.</div>
    <div class="bubble user">Great, how late are you open?</div>
    <div class="bubble other">We close at seven on weekdays<br>and at five on Saturdays.</div>
    <div class="bubble user">Then I will come by tomorrow<br>after work.</div>
    <div class="bubble other">Sounds good. See you then!</div>
  </div>
  <div class="input"><div class="field">Text Message</div></div>
</body>
</html>
