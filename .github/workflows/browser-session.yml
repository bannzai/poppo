# 公開サイト (docs/) を GitHub Actions の Linux runner 上の Chromium で開く caller workflow。実体は bannzai/webtunnel の session.yml (reusable workflow)。
# 参照: https://github.com/bannzai/webtunnel の PROJECT.md「各アプリ repo での実行（reusable workflow）」
name: browser-session
# run-name は local/webtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} duration=${{ inputs.duration_minutes }}m"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / duration_minutes は local/webtunnel の up が常に送るため宣言必須
    # (未定義の input を送ると dispatch が拒否される)。残りは CLI のオプションを使えるようにするためのパススルー
    inputs:
      session:
        required: true
        default: poppo
      duration_minutes:
        required: true
        default: "60"
      start_url:
        required: false
        default: "" # 空なら start_command で起動した静的サーバの URL を開く (session.yml 側の既定)
      record:
        required: false
        default: "true"
      preview:
        required: false
        default: "true"
      setup_script:
        required: false
        default: ".webtunnel/setup.sh"
      software_webgl:
        required: false
        default: "false"

jobs:
  session:
    # id-token: write が必要なのは reusable workflow を呼ぶこの job だけのため、job 単位で最小権限にする
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する (更新時は SHA を書き換える)
    uses: bannzai/webtunnel/.github/workflows/session.yml@6a6146d2b43e45d56931abdfda6c8382073483ca # main 2026-11-09
    with:
      session: ${{ inputs.session }}
      duration_minutes: ${{ inputs.duration_minutes }}
      start_url: ${{ inputs.start_url }}
      record: ${{ inputs.record }}
      preview: ${{ inputs.preview }}
      setup_script: ${{ inputs.setup_script }}
      software_webgl: ${{ inputs.software_webgl }}
      # docs/ は GitHub Pages が配信する静的ファイルのため、ビルドせず静的サーバで配信する。
      # 127.0.0.1 に束縛しないと session.yml の loopback 検証で失敗する
      start_command: python3 -m http.server "$PORT" --bind 127.0.0.1 --directory docs
      port: "8080"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
