name: ci

on:
  pull_request:
  push:
    branches: [main]
  # PR を作る前のブランチでも、開発マシンでビルドせずに同じ検査を流せるようにする
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR は ref ごとに 1 つの group にまとめ、新しい push が来たら前の実行を取り消す。
  # push と workflow_dispatch は commit ごとに group を分ける。同じ group だと、cancel-in-progress が false でも
  # 待機中の実行は次の実行に置き換えられて取り消され、続けて push した時に間の commit の結果が残らないため
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency )
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 実機を決める処理のテスト
        run: bash scripts/test/test-resolve-physical-device.sh

      - name: Makefile の実機向け target のテスト
        run: bash scripts/test/test-makefile-device-targets.sh

      - name: 本体アプリとキーボード拡張の App Group の設定のテスト
        run: bash scripts/test/test-app-group-entitlements.sh

  build-and-test:
    # iOS 27 の SDK と simulator が入っている GitHub-hosted runner は xcode-27 だけ
    # (macos-latest / macos-26 の Xcode は 26 系。https://github.com/actions/runner-images の images/macos/xcode-27-arm64-Readme.md)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode と simulator の版を記録
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: ビルド (make build-ios)
        run: make build-ios

      # ScreenCaptureKit は iOS Simulator の SDK に無く、画面の取り込みの実体は simulator 向けビルドではコンパイルされないため、実機向けの SDK でもビルドする
      - name: 実機向けの SDK でのビルド (make build-ios-device)
        run: make build-ios-device

      # TestFlight への配布 (.github/workflows/ios-deploy.yml) は Release 構成でアーカイブする。配布は手動でだけ起動するため、
      # Release 構成でだけ出るコンパイルエラーを PR の時点で見つける
      - name: 配布と同じ Release 構成での、実機向けの SDK でのビルド (make build-ios-device CONFIGURATION=Release)
        run: make build-ios-device CONFIGURATION=Release

      # 配布の workflow は、developer_menu を入れて起動すると Release 構成に DEBUG の条件を足してアーカイブする (ios-deploy.yml の Archive)。
      # その組み合わせ (Release 構成の最適化 + #if DEBUG のコード) がコンパイルできることを、同じビルド設定で確かめる
      - name: 開発者メニューを入れた Release 構成での、実機向けの SDK でのビルド
        run: xcodebuild -project Poppo.xcodeproj -scheme Poppo -configuration Release -derivedDataPath tmp/DerivedData -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG' build

      # iPhone Duo は使わない (Xcode 27.1 の既知の問題で、iPhone Duo の simulator では大半の app extension を実行できない)
      - name: テスト (make test)
        run: make test DESTINATION='platform=iOS Simulator,name=iPhone 17,OS=latest'
